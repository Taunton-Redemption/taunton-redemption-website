<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taunton Redemption Center</title>
<meta name="description" content="See if Taunton Redemption Center is open right now, which bottles and cans earn the 5¢ Massachusetts deposit, and the shop’s rules.">
<style>
:root {
  --bg: #eef1ee; --ink: #15201a; --muted: #4d5a52; --line: #c9d1cb; --panel: #ffffff;
  --open: #14683c; --closed: #a02820; --soon: #b45309; --notice: #fff3cd; --notice-ink: #5b4300; --link: #0b5a8f;
  --yes: #14683c; --no: #6b3a36;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101612; --ink: #e8efe9; --muted: #aab8ae; --line: #2c3a31; --panel: #18211b;
    --open: #1f8a52; --closed: #c23a31; --soon: #b45309; --notice: #3b3114; --notice-ink: #f3dc9a; --link: #7cc0f0;
    --yes: #5fd08e; --no: #e59a93;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--link); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

.status { color: #fff; padding: 1.5rem 1.25rem 2rem; background: var(--closed); }
.status[data-state="open"] { background: var(--open); }
.status[data-state="closing-soon"] { background: var(--soon); }
.status[data-state="closing-soon"] .status-word { font-size: clamp(2.5rem, 12.5vw, 5.5rem); line-height: 1.05; }
.status-inner, main, footer { max-width: 42rem; margin: 0 auto; }
.status h1 { margin: 0; font-size: 1.05rem; font-weight: 600; opacity: .92; }
.status-word { margin: .25rem 0 0; font-size: clamp(4rem, 24vw, 8rem); line-height: .95; font-weight: 800; letter-spacing: -.03em; }
.status-message { margin: .75rem 0 0; font-size: 1.35rem; font-weight: 700; line-height: 1.25; }
.status-note { margin: .5rem 0 0; font-size: 1.15rem; }

.closures { background: var(--panel); border-bottom: 1px solid var(--line); }
.closures-inner { max-width: 42rem; margin: 0 auto; padding: 1rem 1.25rem; border-left: 8px solid var(--closed); }
.closures h2 { margin: 0 0 .5rem; font-size: 1.15rem; }
.closures ul { margin: 0; padding: 0; list-style: none; }
.closures li { margin: 0 0 .5rem; font-size: 1.1rem; }
.closures li:last-child { margin: 0; }

.notice { background: var(--notice); color: var(--notice-ink); padding: .75rem 1.25rem; font-weight: 600; }
.notice p { max-width: 42rem; margin: 0 auto; }

main { padding: 1.5rem 1.25rem 0; }
section { margin: 0 0 2.25rem; }
h2 { margin: 0 0 .75rem; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.01em; }
h3 { margin: 0 0 .5rem; font-size: 1.15rem; }

.contact { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
.contact p { margin: 0 0 .5rem; }
.contact p:last-child { margin: 0; }
.big-link { font-size: 1.2rem; font-weight: 700; }

table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { text-align: left; padding: .5rem 0; border-bottom: 1px solid var(--line); font-weight: 400; }
th { width: 8.5rem; }
tr.today th, tr.today td { font-weight: 700; }

.lists { display: grid; gap: 1.25rem; }
@media (min-width: 38rem) { .lists { grid-template-columns: 1fr 1fr; } }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; }
.list.yes { border-left: 6px solid var(--yes); }
.list.no { border-left: 6px solid var(--no); }
.list ul { margin: 0; padding-left: 1.2rem; }
.list li { margin: 0 0 .4rem; }

.rules { margin: 0; padding-left: 1.25rem; }
.rules li { margin: 0 0 .6rem; }

footer { padding: 0 1.25rem 2.5rem; color: var(--muted); font-size: .95rem; }
footer p { margin: 0 0 .35rem; }
</style>
</head>
<body>
<header class="status" id="status" data-state="closed" role="status" aria-live="polite">
  <div class="status-inner">
    <h1 id="shop-name"></h1>
    <p class="status-word" id="status-word">&nbsp;</p>
    <p class="status-message" id="status-message" hidden></p>
    <p class="status-note" id="status-note"></p>
  </div>
</header>
<div class="notice" id="placeholder-notice" hidden><p>The hours shown here are placeholders. Check Google for the shop’s current hours.</p></div>
<aside class="closures" id="closures" aria-labelledby="closures-h" hidden>
  <div class="closures-inner">
    <h2 id="closures-h">Upcoming closures</h2>
    <ul id="closures-list"></ul>
  </div>
</aside>

<main>
  <section aria-labelledby="visit-h">
    <h2 id="visit-h">Hours & Location</h2>
    <div class="contact">
      <p><a class="big-link" id="maps-link" rel="noopener"></a></p>
      <p id="phone"></p>
    </div>
    <table><caption class="sr" hidden>Weekly hours</caption><tbody id="hours"></tbody></table>
  </section>

  <section aria-labelledby="return-h">
    <h2 id="return-h">Can I return it?</h2>
    <div class="lists">
      <div class="list yes"><h3 id="yes-h"></h3><ul id="deposit-yes"></ul></div>
      <div class="list no"><h3>No deposit</h3><ul id="deposit-no"></ul></div>
    </div>
  </section>

  <section aria-labelledby="rules-h">
    <h2 id="rules-h">Shop Rules</h2>
    <ul class="rules" id="rules"></ul>
  </section>
</main>

<footer>
  <p id="verified"></p>
  <p>Source: <a id="source-link" rel="noopener">Massachusetts deposit bottle and can recycling (mass.gov)</a></p>
</footer>

<script src="site-data.js"></script>
<script src="status.js"></script>
<script>
(function () {
  var d = SITE_DATA, S = ShopStatus;
  var $ = function (id) { return document.getElementById(id); };

  document.title = d.name + ": open or closed, deposit rules";
  $("shop-name").textContent = d.name;
  $("maps-link").textContent = d.address;
  $("maps-link").href = d.mapsUrl;
  $("source-link").href = d.sourceUrl;
  $("yes-h").textContent = "Yes: " + d.depositCents + "¢ deposit";
  $("placeholder-notice").hidden = !d.hoursArePlaceholder;

  var phoneEl = $("phone");
  if (d.phone) {
    var a = document.createElement("a");
    a.className = "big-link";
    a.href = "tel:" + d.phone.replace(/[^0-9+]/g, "");
    a.textContent = d.phone;
    phoneEl.appendChild(a);
  } else {
    phoneEl.textContent = "Phone number coming soon";
  }

  function fill(listId, items, ordered) {
    var el = $(listId);
    items.forEach(function (t) {
      var li = document.createElement("li");
      li.textContent = t.replace("{cents}", d.depositCents);
      el.appendChild(li);
    });
  }
  fill("deposit-yes", d.depositYes);
  fill("deposit-no", d.depositNo);
  fill("rules", d.rules);

  var verified = new Date(d.lastVerified + "T00:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", year: "numeric", month: "long", day: "numeric" });
  $("verified").textContent = "Deposit rules last verified " + verified + ".";

  // Weekly hours table, Monday first, today in bold.
  var order = [1, 2, 3, 4, 5, 6, 0];
  var rows = [];
  order.forEach(function (i) {
    var key = S.KEYS[i], ranges = d.hours[key] || [];
    var tr = document.createElement("tr");
    tr.setAttribute("data-day", i);
    var th = document.createElement("th");
    th.scope = "row";
    th.textContent = S.NAMES[i];
    var td = document.createElement("td");
    td.textContent = ranges.length
      ? ranges.map(function (r) { return S.formatTime(r[0]) + " to " + S.formatTime(r[1]); }).join(", ")
      : "Closed";
    tr.appendChild(th); tr.appendChild(td);
    $("hours").appendChild(tr);
    rows.push(tr);
  });

  function render() {
    var s = S.computeStatus(d, new Date());
    var box = $("status");
    box.setAttribute("data-state", s.state);
    $("status-word").textContent = s.state === "open" ? "Open" : s.state === "closing-soon" ? "Closing Soon" : "Closed";
    var msg = $("status-message");
    msg.textContent = s.message;
    msg.hidden = !s.message;
    $("status-note").textContent = s.note;
    var upcoming = S.upcomingClosures(d, new Date());
    var list = $("closures-list");
    list.textContent = "";
    upcoming.forEach(function (c) {
      var li = document.createElement("li");
      var strong = document.createElement("strong");
      strong.textContent = c.label + ":";
      li.appendChild(strong);
      li.appendChild(document.createTextNode(" " + c.message));
      list.appendChild(li);
    });
    $("closures").hidden = upcoming.length === 0;
    var today = S.shopNow(new Date(), d.timeZone).dayIndex;
    rows.forEach(function (tr) {
      tr.className = Number(tr.getAttribute("data-day")) === today ? "today" : "";
    });
  }
  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
